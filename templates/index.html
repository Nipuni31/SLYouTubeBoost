<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Channel Performance Predictor</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-5">

          <h2 class="text-center mb-4 text-primary">
            🎥 High-Performing Channel Predictor
          </h2>

          <p class="text-center text-muted">
            Enter your YouTube channel metrics below
          </p>

          <form action="/predict" method="post">

            <div class="row">
              {% for f in features %}
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">{{f.replace('_',' ').title()}}</label>
                  <input type="number" step="any" class="form-control"
                         name="{{f}}" value="{{defaults[f]}}" required>
                </div>
              {% endfor %}
            </div>

            <div class="d-grid mt-4">
              <button class="btn btn-primary btn-lg rounded-3">
                🚀 Predict Performance
              </button>
            </div>

          </form>

          <p class="text-muted small mt-3 text-center">
            Fields are pre-filled with median training values.
          </p>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
